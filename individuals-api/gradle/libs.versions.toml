[versions]
java-version = "24"
spring-boot-version = "3.5.0"
springdoc-openapi-version = "2.4.0"
mapstruct-version = "1.5.5.Final"
javax-annotation-version = "1.3.2"
lombok-version = "1.18.40"
netty-dns-macos-version = "4.1.121.Final"
testcontainers-version = "1.19.3"
testcontainers-keycloak-version = "3.4.0"
assertj-version = "3.11.1"
jackson-databind-nullable-version = "0.2.6"

[plugins]
springBoot = { id = "org.springframework.boot", version.ref = "spring-boot-version" }
springDependencyManagement = { id = "io.spring.dependency-management", version = "1.1.6" }
openApiGenerator = { id = "org.openapi.generator", version = "7.4.0" }

[libraries]
# Spring Boot
spring-boot-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }

# OpenAPI
springdoc-openapi-webflux = { module = "org.springdoc:springdoc-openapi-starter-webflux-ui", version.ref = "springdoc-openapi-version" }
jackson-databind-nullable = { module = "org.openapitools:jackson-databind-nullable", version.ref = "jackson-databind-nullable-version" }

# Monitoring
micrometer-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }

# Mapping
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct-version" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct-version" }

# Utilities
javax-annotation = { module = "javax.annotation:javax.annotation-api", version.ref = "javax-annotation-version" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok-version" }

# Runtime
netty-dns-macos = { module = "io.netty:netty-resolver-dns-native-macos", version.ref = "netty-dns-macos-version" }

# Testing
spring-boot-test = { module = "org.springframework.boot:spring-boot-starter-test" }
reactor-test = { module = "io.projectreactor:reactor-test" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers-version" }
testcontainers = { module = "org.testcontainers:testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter" }
testcontainers-keycloak = { module = "com.github.dasniko:testcontainers-keycloak", version.ref = "testcontainers-keycloak-version" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj-version" }

[bundles]
springBootWeb = ["spring-boot-webflux", "spring-boot-actuator", "spring-boot-validation"]
springSecurity = ["spring-boot-security", "spring-boot-oauth2-resource-server"]

openApi = ["springdoc-openapi-webflux", "jackson-databind-nullable"]

micrometer = ["micrometer-prometheus"]

mapstructBundle = ["mapstruct", "mapstruct-processor"]

compileOnlyLibs = ["javax-annotation", "lombok"]

runtimeOnlyLibs = ["netty-dns-macos"]

testContainers = ["testcontainers", "testcontainers-junit", "testcontainers-keycloak"]
springBootTest = ["spring-boot-test", "reactor-test", "junit-platform-launcher", "assertj"]