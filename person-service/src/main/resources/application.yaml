server:
  port: 8092

spring:
  application:
    name: person-service
  datasource:
    url: ${PERSON_SERVICE_DB_URL:jdbc:postgresql://localhost:5432/person}
    username: ${PERSON_SERVICE_DB_USERNAME:postgres}
    password: ${PERSON_SERVICE_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    validate-on-migrate: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: person
        show_sql: ${SHOW_SQL:true}
        format_sql: ${FORMAT_SQL:true}
        highlight_sql: ${HIGHLIGHT_SQL:true}
        session.events.log.LOG_QUERIES_SLOWER_THAN_MS: ${SLOW_SQL_QUERY_INDICATOR_MS:1500}
        hbm2ddl:
          auto: validate
        envers:
          autoRegisterListeners: true
          audit_table_suffix: _aud
          default_schema: person_aud
          store_data_at_delete: true
          revision_sequence_name: person_aud.revinfo_seq

  management:
    endpoints:
      web:
        exposure:
          include: health,info,prometheus
    endpoint:
      prometheus:
        access: read_only
    prometheus:
      metrics:
        export:
          enabled: true
    tracing:
      enabled: true
      sampling:
        probability: 1.0

  otel:
    exporter:
      otlp:
        endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
        protocol: http/protobuf
    logs:
      exporter: none
    metrics:
      exporter: none
  logging:
    config: "classpath:logback.xml"