spring:
  application:
    name: person-service-test
  
  datasource:
    driver-class-name: org.postgresql.Driver
  
  flyway:
    enabled: true
    validate-on-migrate: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: person
        show_sql: true
        format_sql: true
        highlight_sql: false
        hbm2ddl:
          auto: validate
        envers:
          autoRegisterListeners: true
          audit_table_suffix: _aud
          default_schema: person_aud
          store_data_at_delete: true
          revision_sequence_name: person_aud.revinfo_seq
    show-sql: true
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.type.descriptor.jdbc: TRACE

otel:
  exporter:
    otlp:
      enabled: false
  logs:
    exporter: none
  metrics:
    exporter: none

management:
  endpoints:
    enabled-by-default: false
  tracing:
    enabled: false






